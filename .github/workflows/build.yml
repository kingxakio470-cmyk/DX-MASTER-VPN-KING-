name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q DX_MASTER_AutoAnswer_v3.zip -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        working-directory: proj/AutoAnswer_Accessibility_Project
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DX-MASTER-APK
          path: proj/AutoAnswer_Accessibility_Project/app/build/outputs/apk/debug/app-debug.apk
